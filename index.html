<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo | PlanHogar</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div>
      <a href="/" class="logo">Plan<span>Hogar</span></a>
      <p class="tagline">Catálogo de productos</p>
    </div>
    <button id="cart-toggle" class="btn-cart" type="button" aria-haspopup="dialog" aria-controls="cart-drawer">
      🛒 Carrito <span id="cart-count" class="cart-count" hidden>0</span>
    </button>
  </div>
</header>

<main class="container">

  <section class="filters" aria-label="Filtros">
    <div class="filter-group">
      <label for="search">Buscar</label>
      <input type="search" id="search" placeholder="Nombre o código (SKU)...">
    </div>

    <div class="filter-group">
      <label for="rubro">Rubro</label>
      <select id="rubro">
        <option value="">Todos los rubros</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="etiqueta">Etiqueta</label>
      <select id="etiqueta">
        <option value="">Todas las etiquetas</option>
      </select>
    </div>

    <button id="clear-filters" class="btn-clear" type="button">Limpiar filtros</button>
  </section>

  <div class="results-bar">
    <span id="results-count">Cargando productos...</span>
  </div>

  <section id="grid" class="grid" aria-live="polite"></section>

  <div class="load-more-wrap">
    <button id="load-more" class="btn-load-more" type="button" hidden>Ver más productos</button>
  </div>

  <p id="empty-state" class="empty-state" hidden>No se encontraron productos con esos filtros.</p>
  <p id="error-state" class="error-state" hidden>No se pudo cargar el catálogo. Probá recargar la página.</p>

</main>

<footer class="site-footer">
  <p>PlanHogar &copy; <span id="year"></span></p>
</footer>

<div id="overlay" class="overlay" hidden></div>

<div id="product-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="modal-content">
    <button id="modal-close" class="modal-close" type="button" aria-label="Cerrar">&times;</button>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<aside id="cart-drawer" class="cart-drawer" role="dialog" aria-modal="true" aria-label="Carrito de compras" hidden>
  <div class="cart-drawer-header">
    <h2>Tu carrito</h2>
    <button id="cart-close" class="modal-close" type="button" aria-label="Cerrar carrito">&times;</button>
  </div>
  <div id="cart-items" class="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total-row">
      <span>Total</span>
      <strong id="cart-total">$0</strong>
    </div>
    <button id="cart-checkout" class="btn-whatsapp" type="button" disabled>Finalizar pedido por WhatsApp</button>
    <button id="cart-clear" class="btn-clear-cart" type="button">Vaciar carrito</button>
  </div>
</aside>

<script src="app.js"></script>
</body>
</html>
